<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
<rect width="1000" height="660" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526d7a"/></marker></defs>
<text x="30" y="36.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#152b38">A staged native compatibility roadmap</text>
<text x="30" y="65.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#52616a">Proposed milestones with explicit acceptance gates</text>
<rect x="70" y="100" width="860" height="79" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="130.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">1  Complete one task</text>
<text x="500.0" y="159.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Native family + exact recipe + typed result + honest readiness</text>
<path d="M500,179 L500,198" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70" y="205" width="860" height="79" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="235.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">2  Qualify the whole slice</text>
<text x="500.0" y="264.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Tensor audit + processor goldens + reference parity + cancel / drain</text>
<path d="M500,284 L500,303" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70" y="310" width="860" height="79" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="340.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">3  Reuse across checkpoints</text>
<text x="500.0" y="369.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Second compatible checkpoint without a new model-ID branch</text>
<path d="M500,389 L500,408" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70" y="415" width="860" height="79" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="445.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">4  Add a different task shape</text>
<text x="500.0" y="474.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Vision, audio or structured numerical task tests the abstraction</text>
<path d="M500,494 L500,513" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70" y="520" width="860" height="79" rx="8" fill="#eaf3ee" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="550.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">5  Contribute a proven seam</text>
<text x="500.0" y="579.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Small diagnostics, validation, helper or kernel change with tests</text>
<text x="500" y="644.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">Retain qualified ecosystem and graph routes where native semantics are absent</text>
</svg>