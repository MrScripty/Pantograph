<text x="745.0" y="140.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Request state</text>
<text x="745.0" y="169.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Caches / inputs / RNG / output queue</text>
<text x="745.0" y="192.76" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#152b38">Never implicitly shared across requests</text>
