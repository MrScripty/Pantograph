<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685">
<rect width="1000" height="685" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526d7a"/></marker></defs>
<text x="30" y="36.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#152b38">OpenVINO separates reading querying compiling and running</text>
<text x="30" y="65.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#52616a">Source based preparation ladder; qualification is an additional application step</text>
<rect x="120" y="100" width="760" height="78" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="130.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Read or convert</text>
<text x="500.0" y="159.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">A frontend produces an ov::Model</text>
<path d="M500,178 L500,197" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120" y="205" width="760" height="78" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="235.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Query target support</text>
<text x="500.0" y="264.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">Operation-to-device evidence under chosen properties</text>
<path d="M500,283 L500,302" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120" y="310" width="760" height="78" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="340.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Compile for target policy</text>
<text x="500.0" y="369.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">Prepared model, precision / shape profile and actual device choices</text>
<path d="M500,388 L500,407" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120" y="415" width="760" height="78" rx="8" fill="#eaf1f5" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="445.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Create an InferRequest</text>
<text x="500.0" y="474.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">Own input / output buffers and mutable sequence state</text>
<path d="M500,493 L500,512" fill="none" stroke="#526d7a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="120" y="520" width="760" height="78" rx="8" fill="#eaf3ee" stroke="#748994" stroke-width="1.5"/>
<text x="500.0" y="550.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#152b38">Run and qualify</text>
<text x="500.0" y="579.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#152b38">Numerical and task evidence under the exact plan</text>
<text x="500" y="648.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#152b38">A successful query is not a compile; a successful compile is not task accuracy</text>
</svg>